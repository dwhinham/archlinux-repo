# Factory Wi-Fi and Bluetooth addresses for this machine.
#
# They are held in the DPP partition of the SPI-NOR flash, which Linux has no
# driver for, so they cannot be read at runtime. Recover them from a firmware
# dump or from Windows. The two are normally consecutive.
#
# Nothing is changed while these are unset.

#WIFI_MAC=
#BT_MAC=
