name: Build repository

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - name: Fetch published packages
        run: |
          mkdir -p out
          gh release download aarch64 --dir out --pattern '*.pkg.tar.*' || true

      # A kernel build with Arch's config needs far more room than a runner
      # has spare, and running out kills it without leaving any logs.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          docker run --rm -v "$PWD:/build" -e SIGNING_KEY \
            ironrobin/archports-aarch64:latest /build/build.sh

      - name: Report disk use
        if: always()
        run: df -h /

      # Saved even on failure: a timed out kernel build still leaves a warm cache.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}

      - name: Publish
        run: |
          gh release create aarch64 --title "Packages (aarch64)" --notes "" || true
          gh release upload aarch64 out/* --clobber
